name: Paper 8 code-only static checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source integrity and reject accidental data uploads
        run: python3 -B scripts/public_code_preflight.py
      - name: Run synthetic safety tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify portable code interface (no numerical fits)
        run: python3 -B portable/portable_cli.py verify
